name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hf
          POSTGRES_PASSWORD: hfpass
          POSTGRES_DB: hireforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hf" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Checks and tests on SQLite
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
      - name: Tests on PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgres://hf:hfpass@127.0.0.1:5432/hireforge
        run: python manage.py test
